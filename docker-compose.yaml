  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalcer
      POSTGRES_PASSWORD: vitalcer
      POSTGRES_DB: vitalcer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgre.prod.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalcer -d vitalcer"]
      interval: 5s
      timeout: 5s
      retries: 5

