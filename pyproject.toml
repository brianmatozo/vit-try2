[project]
name = "vitalcer-try2"
version = "1.0"
description = "python backend for ecommerce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "fastapi[standard]>=0.136.1",
  "fastcrud>=0.22.3",
  "pillow>=13.0.0",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy>=2.0.49",
  "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = ["mypy>=2.1.0", "pyinstaller>=6.11.0", "pytest>=9.0.3", "ruff>=0.15.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "tools", "data", "apps", "packages", "node_modules"]
addopts = "-p no:platformdirs"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.src]
include = ["server", "scripts", "tests"]
exclude = ["apps/", "packages/"]
